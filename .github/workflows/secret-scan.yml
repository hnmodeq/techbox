name: Secret Scan

# Blocks credentials from entering the repository.
#
# Runs on every push and PR. On a pull request it scans only the commits in
# that PR; on main it scans the full history, so a rewrite that reintroduces
# an old leak is caught too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the branch history only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full depth, but see the re-clone below: actions/checkout also
          # fetches refs/pull/*, and 23 closed PRs still point at the
          # pre-rewrite history. Those refs are immutable — GitHub does not
          # let you delete them — so a scan of "everything the runner has"
          # reports commits that no clone of this repository can reach.
          fetch-depth: 0
          persist-credentials: false

      - name: Reduce to what a real clone sees
        # The July 2026 history rewrite removed the files that leaked a Neon
        # password and a GitHub PAT. `git clone` of this repo is clean: 1107
        # commits, zero findings. But the runner's checkout carries ~1957
        # commits because refs/pull/<n>/head for every closed PR still pins
        # the old objects.
        #
        # Re-clone from the local checkout over the `file://` transport, which
        # copies only what is reachable from refs/heads and refs/tags — the
        # same history a contributor gets. A genuine leak on this branch still
        # fails the job; a ghost held alive by a closed PR ref does not.
        run: |
          # actions/checkout leaves refs/pull/* and refs/remotes/* in the
          # local repo, and `git clone` copies every ref it can see — so
          # cloning alone is not enough. Build the target from a single
          # explicit ref instead: init an empty repo and fetch only this
          # commit's history.
          SHA="$(git rev-parse HEAD)"
          git init --quiet /tmp/scan-target
          git -C /tmp/scan-target fetch --quiet "file://$PWD" "$SHA"
          git -C /tmp/scan-target reset --quiet --hard FETCH_HEAD
          echo "Commits a fresh clone sees: $(git -C /tmp/scan-target rev-list --all --count)"

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository
        run: |
          gitleaks detect \
            --source /tmp/scan-target \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path "$GITHUB_WORKSPACE/gitleaks.sarif"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
