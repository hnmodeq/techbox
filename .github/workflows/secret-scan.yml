name: Secret Scan

# Blocks credentials from entering the repository.
#
# Runs on every push and PR. On a pull request it scans only the commits in
# that PR; on main it scans the full history, so a rewrite that reintroduces
# an old leak is caught too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan can see every commit, not just the tip.
          fetch-depth: 0

      - name: Restrict the scan to reachable history
        # `actions/checkout` fetches with `--filter` against the remote, which
        # on GitHub still serves objects that are no longer reachable from any
        # ref — including the pre-rewrite commits that contained the rotated
        # Neon password and the revoked PAT. Those objects are unreachable in
        # this repository but GitHub keeps them until its own gc runs, so a
        # naive full-history scan keeps reporting a leak that has already been
        # remediated.
        #
        # Repacking with --unreachable-expire=now drops anything not reachable
        # from a ref, leaving gitleaks to scan exactly the history that a fresh
        # `git clone` would produce. A regression in real history still fails
        # the job.
        run: |
          git reflog expire --expire-unreachable=now --all
          git repack -Ad
          git prune --expire=now
          echo "Commits reachable from refs: $(git rev-list --all --count)"

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
