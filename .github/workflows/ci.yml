name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-production signing key used only by ephemeral CI runners.
  AUTH_SECRET: ci-only-auth-secret-48-characters-minimum-change-me

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit Tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://hnmodeq-techbox.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build
        run: pnpm run build

  optional-db-checks:
    name: Optional DB/content checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # These checks are informational: a missing DATABASE_URL secret or a
    # transient DB/content issue must not turn the whole CI status red.
    continue-on-error: true
    if: ${{ needs.build.result == 'success' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLIC_BUCKET: ${{ vars.SUPABASE_PUBLIC_BUCKET }}
      SUPABASE_PRIVATE_BUCKET: ${{ vars.SUPABASE_PRIVATE_BUCKET }}
      STORAGE_CHECK_LIMIT: 200

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check:all when DATABASE_URL is configured
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm check:all

      - name: Skip DB checks when DATABASE_URL is not configured
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret is not configured; skipping optional DB/content checks."

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: ${{ needs.build.result == 'success' }}

    # An ephemeral Postgres for the suite.
    #
    # This job used to run with no DATABASE_URL. Every Prisma call failed
    # ("You must provide a nonempty URL"), each homepage section caught the
    # error and self-hid, and the tests were asserting against a near-empty
    # page — which is why "renders at least half the sections" and "no
    # invisible text in dark mode" failed on every run regardless of the
    # commit. A throwaway container is the right fixture here: deterministic,
    # no shared state, and no production credential in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techbox
          POSTGRES_PASSWORD: techbox
          POSTGRES_DB: techbox_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://techbox:techbox@127.0.0.1:5432/techbox_e2e?connection_limit=1
      DIRECT_URL: postgresql://techbox:techbox@127.0.0.1:5432/techbox_e2e
      NEXT_PUBLIC_SITE_URL: https://hnmodeq-techbox.vercel.app
      E2E_SEED_CONFIRM: yes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.12.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Seed deterministic E2E fixtures
        run: pnpm exec tsx prisma/seed-e2e.ts
      - name: Install Playwright Browsers
        # The default Playwright CDN (playwright.azureedge.net) returns HTTP 403
        # in some regions/networks. Retry against the Microsoft Azure CDN mirror,
        # and as a last resort install the msedge channel (also served from
        # Microsoft's CDN) — the Playwright config picks it up via the
        # PLAYWRIGHT_BROWSER_CHANNEL env var, so the smoke tests still run.
        run: |
          pnpm exec playwright install --with-deps chromium || \
          PLAYWRIGHT_DOWNLOAD_HOST=https://playwright.download.prss.microsoft.com/dbazure/download/playwright pnpm exec playwright install --with-deps chromium || \
          (pnpm exec playwright install --with-deps msedge && echo "PLAYWRIGHT_BROWSER_CHANNEL=msedge" >> "$GITHUB_ENV")
      - name: Run complete E2E suite
        run: pnpm test:e2e