# Gitleaks configuration for TechBox.
#
# This exists because real credentials reached this repository's history once
# already (a Neon database password and a GitHub PAT, via readme/next-prompts.txt).
# Rotation fixed the exposure; this file is what stops the next one, because
# "remember not to paste secrets" is not a control.
#
# NOTE ON REGEX DIALECT: gitleaks compiles patterns with Go's RE2, which has no
# lookahead/lookbehind. Exclusions belong in [allowlist], not in the pattern.

[extend]
# Start from the upstream ruleset — AWS keys, GitHub tokens, Slack tokens,
# private keys, and ~150 other providers.
useDefault = true

[[rules]]
id = "neon-role-password"
description = "Neon role password (npg_ prefix)"
regex = '''npg_[A-Za-z0-9]{16,}'''
tags = ["database", "credential"]

[[rules]]
id = "postgres-inline-password"
description = "PostgreSQL connection string with an inline password"
# Placeholder forms (user:password@, u:p@, :YOUR_PASSWORD@) are filtered by the
# allowlist below rather than by a lookahead, which RE2 does not support.
regex = '''postgres(?:ql)?://[A-Za-z0-9_.-]+:[^\s:@/]{6,}@[A-Za-z0-9.-]+'''
tags = ["database", "credential"]

[[rules]]
id = "supabase-service-role-key"
description = "Supabase service-role JWT — server-only, never NEXT_PUBLIC_"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'''
tags = ["supabase", "credential"]

[[rules]]
id = "auth-secret-assignment"
description = "AUTH_SECRET assigned a real-looking value"
regex = '''AUTH_SECRET\s*=\s*["']?[A-Za-z0-9+/=_-]{24,}'''
tags = ["session", "credential"]

[allowlist]
description = "Documentation placeholders, fixtures, and CI-only values"
paths = [
  '''\.env\.example$''',
  '''^docs/''',
  '''^README\.md$''',
  '''^CONTRIBUTING\.md$''',
  '''^SECURITY\.md$''',
  '''^\.gitleaks\.toml$''',
  '''^\.github/workflows/''',
  '''^tests/unit/db-pool-config\.test\.ts$''',
]
# Anything matching one of these is a documented placeholder, a unit-test
# fixture, or the ephemeral CI database — never a real credential.
regexes = [
  '''YOUR_PASSWORD''',
  '''YOURPROJECT''',
  '''PASSWORD@''',
  '''postgres(?:ql)?://user:password@''',
  '''postgres(?:ql)?://u:p@''',
  '''postgres(?:ql)?://techbox:techbox@''',
  '''ci-only-auth-secret''',
  '''your-super-secret''',
  '''change-me''',
  '''placeholder''',
]
# Browser storage keys look like generic API keys to the default ruleset.
# `tb_compare_v1` is a localStorage key, not a credential.
stopwords = [
  "tb_compare_v1",
  "tb_consultation_v1",
  "tb_session",
  "takbox-theme",
]
